name: Build the top-voted ideas
on:
  workflow_dispatch: # by hand only: Actions > Build the top-voted ideas > Run workflow
    inputs:
      settle_only:
        description: "only record merged/closed PRs and receipts; build nothing"
        type: boolean
        default: false
      reopen:
        description: "idea ids declined by mistake, comma-separated: reopened, then built"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install numpy  # hub.py's synth; the Dockerfile installs it the same way
      - run: |
          git config user.name "secret-agent-band-builder"
          git config user.email "builder@secretagentband.illsea.com"
      - run: python3 builder/build_ideas.py ${{ inputs.settle_only && '--settle-only' || '' }} --reopen "$REOPEN"
        env:
          HUB_URL: https://secretagentband.illsea.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REOPEN: ${{ inputs.reopen }}
